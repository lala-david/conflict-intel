name: Daily Conflict Intelligence

# 무료 클라우드 자동화 (일일 분쟁·안보 인텔 수집).
#   - 매일 09:00 KST(00:00 UTC) 자동 수집
#   - DB(276MB, gitignore)는 GitHub Actions 캐시로 영속화(레포 비공개, 공개 다운로드 불가): 복원 → 저장
#   - 수집/통계 후 변경분을 Cloudflare D1(SQLite)에 동기화 → Cloudflare Worker 사이트가 읽음
#   - 리포트(.md)는 평소처럼 repo 에 커밋
#
# 필요한 repo Secrets:
#   OPENAI_API_KEY, UCDP_TOKEN            — 수집/BLUF
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, D1_DATABASE_ID  — 사이트 D1 동기화 (REST, CLI 불필요)
# 풀 DB는 db-latest 릴리스에 보관 → 캐시 미스 시 시드 (통계 정확성 보장).
# ⚠️ DISABLED 2026-09-28 (`gh workflow disable`). Every run since 2026-08-03 failed at
#    "Sync to D1" with code 7500 "Exceeded maximum DB size", and because that step sits
#    BEFORE the cache-save / db-latest / commit-reports steps, each run discarded all of
#    its work — while GitHub mailed the owner a failure notice 4x a day. Collection moved
#    to the laptop meanwhile (scripts/run_backfill_local.ps1).
#    Re-enable once D1 is back under its size limit:  gh workflow enable "Daily Conflict Intelligence"
on:
  schedule:
    # 아침·점심·저녁 KST — 00:00/05:00/10:00 UTC = 09:00/14:00/19:00 KST (NCTC 제외)
    - cron: "0 0,5,10 * * *"
    # NCTC 전용 하루 1회 — 08:00 UTC = 17:00 KST (이 실행에서만 NCTC 수집)
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      backfill_date:
        description: "Backfill start date (YYYY-MM-DD). Empty = normal today run."
        required: false
        default: ""
      backfill_to:
        description: "Backfill end date, inclusive (YYYY-MM-DD). Empty = just the start date."
        required: false
        default: ""

concurrency:
  group: daily-terror
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    # 평소 런은 ~10분; backfill 범위 루프(여러 날 재수집)를 위해 상향 (정상 런엔 영향 없음, 상한일 뿐).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # ─── DB 영속화: 이전 conflict.db 를 Actions 캐시(비공개)에서 복원 (없으면 새로 시작) ───
      #     path must match the Save step exactly — actions/cache folds the path
      #     list into the cache version hash, so an extra entry here (e.g. the old
      #     data/terror.db) makes every restore-key miss even on a matching prefix.
      - name: Restore DB (private cache)
        uses: actions/cache/restore@v4
        with:
          path: data/conflict.db
          # v2: bumped 2026-07 to force a reseed from the refreshed db-latest
          # (590K w/ GTD backfill) — old caches held a stale pre-GTD ~420K DB
          # that kept resetting global_stats. Old prefixes intentionally dropped.
          key: conflict-db-v2-${{ github.run_id }}
          restore-keys: |
            conflict-db-v2-

      - name: Migrate legacy DB filename (terror.db → conflict.db)
        run: |
          if [ -f data/terror.db ] && [ ! -f data/conflict.db ]; then
            mv data/terror.db data/conflict.db
            echo "migrated legacy terror.db → conflict.db"
          fi

      # ─── 캐시가 없으면 db-latest 릴리스에서 풀 DB(419K)를 시드 → 통계가 정확해짐 ───
      - name: Seed full DB from db-latest (on cache miss)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/conflict.db ]; then
            echo "cache miss — seeding full DB from db-latest release"
            # Prefer the canonical conflict.db asset; fall back to the legacy
            # terror.db asset name and rename it (kept for older snapshots).
            gh release download db-latest --pattern conflict.db --dir data --clobber \
              || gh release download db-latest --pattern terror.db --dir data --clobber \
              || echo "no db-latest asset"
            if [ ! -f data/conflict.db ] && [ -f data/terror.db ]; then
              mv data/terror.db data/conflict.db
              echo "seeded from legacy terror.db asset → conflict.db"
            fi
          fi
          # NB: keep this as an if/else — a bare `[ -f … ] && …` is the last
          # command under `bash -e`, so a missing file would exit the step 1.
          if [ -f data/conflict.db ]; then
            echo "DB ready: $(du -h data/conflict.db | cut -f1)"
          else
            echo "WARNING: no DB seed available — pipeline starts from an empty DB"
          fi

      - name: Run medallion pipeline (bronze → silver → gold)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
          PYTHONUNBUFFERED: "1"
          # Optional: point at the self-hosted LLM through a Cloudflare Tunnel so
          # CI gets the full gemma4 enrichment. Unset → LLM steps skip gracefully.
          # e.g. https://llm.example.com/v1  (see docs/LLM_TUNNEL.md)
          LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT }}
          # NCTC only on the 17:00 KST (08:00 UTC) run; skipped on the 09/14/19 cycles.
          RUN_NCTC: ${{ github.event.schedule == '0 0,5,10 * * *' && 'skip' || '' }}
        timeout-minutes: 50
        # Normal run → today. backfill_date [.. backfill_to] (workflow_dispatch)
        # re-collects a past day/range via GDELT/UCDP archives to fill an outage
        # gap; downstream normalize/compute_stats/sync then run once over the lot.
        run: |
          from="${{ github.event.inputs.backfill_date }}"
          to="${{ github.event.inputs.backfill_to }}"
          if [ -z "$from" ]; then
            python -u scripts/pipeline/run.py
          else
            [ -z "$to" ] && to="$from"
            d="$from"
            while :; do
              echo "===== backfill $d ====="
              python -u scripts/pipeline/run.py "$d" || echo "day $d failed — continuing"
              [ "$d" = "$to" ] && break
              d="$(date -I -d "$d + 1 day")"
            done
          fi

      # ─── 국가명 정규화: 역사적/변형 명칭("Russia (Soviet Union)" 등)을 모던명에 접어
      #     통계 이중집계·지도 미표시 방지 (idempotent). compute_stats 전에 실행. ───
      - name: Normalize country names
        run: python scripts/normalize_countries.py

      - name: Weekly summary (Sundays only)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
        run: |
          if [ "$(date +%u)" = "7" ]; then
            python scripts/weekly_summary.py
          fi

      - name: Compute dashboard stats
        run: python scripts/compute_stats.py

      # ─── AI 검증 패스: 로컬 LLM으로 고가치 이벤트 교차검증 (LLM 미도달 시 안전 no-op) ───
      - name: AI verification pass
        env:
          LOCAL_LLM_BASE_URL: ${{ secrets.LOCAL_LLM_BASE_URL }}
          AI_VERIFY_LIMIT: "200"
        run: python scripts/ai_verify.py

      # ─── 갱신된 conflict.db 를 Actions 캐시 + db-latest 릴리스에 저장 (다음 실행이 이어받음) ───
      - name: Save DB (private cache)
        uses: actions/cache/save@v4
        with:
          path: data/conflict.db
          key: conflict-db-v2-${{ github.run_id }}

      - name: Refresh db-latest release
        if: ${{ hashFiles('data/conflict.db') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload db-latest data/conflict.db --clobber

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/classifications.json data/conflict_zones.json data/countries.json data/organizations.json data/.sanctions_cache.json data/known_ucdp_ids.json
          git diff --staged --quiet || (git commit -m "intel: $(date +%Y-%m-%d) daily brief" && git push)

      # ─── 사이트가 읽는 Cloudflare D1 에 동기화 — 반드시 마지막 ───
      #  이 스텝이 캐시 저장 / db-latest / 리포트 커밋보다 앞에 있던 탓에 2026-08~09 동안
      #  D1 이 실패할 때마다 그날 수집분이 통째로 버려졌다 (8주 유실). 수집 결과를 먼저
      #  보존하고 나서 동기화한다. 실패해도 런은 실패로 표시되고, sync_to_d1.py 는 커서를
      #  D1 에 두므로 다음 런이 이어서 올린다. 쓰기는 무료 한도(10만 행/일) 안으로 제한.
      - name: Sync to D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        # 하루 4런 x 20K = 80K — 사이트 자체 쓰기(waitlist 등) 몫을 남긴다.
        run: python scripts/sync_to_d1.py --max-writes 20000

      # ─── 실패 알림: 추적 이슈 1건만 유지 ───
      #  하루 4런이 같은 원인으로 실패하면 이슈가 매번 새로 생겨 메일 폭탄이 된다
      #  (2026-08~09: 215건 누적). 열린 automated 이슈가 있으면 새로 만들지 않고
      #  본문만 갱신한다 — 이슈 본문 수정은 알림 메일을 발생시키지 않는다.
      #  NB: GitHub 자체의 "scheduled workflow 실패" 메일은 계정 알림 설정
      #      (github.com/settings/notifications → Actions)에서 따로 끈다.
      - name: Alert on failure (single tracking issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: found } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated',
              per_page: 100,
            });
            // listForRepo also returns PRs — keep real issues only.
            const tracking = found.filter((i) => !i.pull_request)[0];
            if (tracking) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: tracking.number,
                body: `Daily pipeline is still failing.\n\nLast checked: ${today}\nLatest failed run: ${runUrl}\n\n(이 이슈는 실패할 때마다 본문만 갱신됩니다 — 중복 이슈/메일 방지용 추적 이슈입니다.)`,
              });
              core.info(`tracking issue #${tracking.number} updated — no new issue, no mail`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily conflict brief failing — since ${today}`,
              body: `Daily pipeline failed.\n\nFirst seen: ${today}\nLatest failed run: ${runUrl}\n\n(이 이슈는 실패할 때마다 본문만 갱신됩니다 — 중복 이슈/메일 방지용 추적 이슈입니다.)`,
              labels: ['bug', 'automated'],
            });
